
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#244d78">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <title>Consulta de documento</title>

  <style>
    :root {
      --navy: #214b78;
      --blue: #087fc2;
      --text: #23364b;
      --green: #20a64a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 14px 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);

      /* Fondo principal */
      background-color: #244d78;
      background-image:
  linear-gradient(
    rgba(36, 77, 120, 0.95),
    rgba(36, 77, 120, 0.95)
  ),
  url("./fondo.jpg");

      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }

    /* LOGOTIPO SUPERIOR */
    .top-logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      border: none;
      box-shadow: none;
    }

    .top-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;

      background: transparent;
      border: none;
      box-shadow: none;
    }

    /* CONTENEDOR PRINCIPAL */
    .page {
      width: 100%;
      max-width: 936px;
      margin: 0 auto;

      background: #fff;
      border-radius: 6px;
      overflow: hidden;

      box-shadow: 0 12px 35px rgba(0,0,0,.20);
    }

    /* ENCABEZADO */
    header {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 10px 18px;

      color: white;
      background: var(--navy);
      border-bottom: 3px solid #00a6e8;
    }

    header h1 {
      margin: 0;
      font-size: 15px;
      letter-spacing: .2px;
      flex: 1;
    }

    /* LOGO DEL ENCABEZADO SIN RECUADRO */
    .header-logo {
      width: 38px;
      height: 38px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      border: none;
      box-shadow: none;
      overflow: visible;
    }

    .header-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;

      background: transparent;
      border: none;
      box-shadow: none;
    }

    .placeholder {
      color: #777;
      font-size: 10px;
      text-align: center;
      padding: 5px;
    }

    /* ICONO DE SEGURIDAD */
    .shield-icon {
      width: 27px;
      height: 27px;
      min-width: 27px;
      display: block;
      flex-shrink: 0;
    }

    /* INFORMACIÓN DEL DOCUMENTO */
    .info {
      padding: 22px 24px 25px;
      border-bottom: 1px solid #e1e5e9;
    }

    .info-title {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;

  padding: 13px 15px;
  margin-bottom: 19px;

  color: #1762a7;
  background: #e5f3fc;

  border-left: 4px solid #00a8e8;
  border-radius: 4px;

  font-size: 11px;
  font-weight: 700;
  letter-spacing: .25px;
  line-height: 1.2;
}

.info-title svg {
  display: block;
  width: 22px;
  height: 22px;
  min-width: 22px;
  flex-shrink: 0;
}

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      display: block;
      margin-bottom: 7px;

      color: #526171;
      font-size: 10px;
      font-weight: 700;
    }

    .field .value {
      min-height: 34px;
      padding: 9px 11px;

      background: #f0f2f4;
      border: 1px solid #dfe3e7;
      border-radius: 4px;

      font-size: 12px;
    }

    /* SECCIÓN DEL DOCUMENTO */
    .document-section {
      padding: 22px 20px 26px;
    }

    .document-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .document-title {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--navy);
    }

    .document-title h2 {
      margin: 0;
      font-size: 16px;
    }

    .status {
      display: inline-block;
      margin-top: 7px;
      padding: 4px 9px;

      border-radius: 20px;
      background: #e8f5e9;
      color: #27833d;

      font-size: 9px;
      font-weight: 700;
    }

    /* BOTÓN DESCARGAR */
    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      min-height: 39px;
      padding: 0 16px;

      border-radius: 5px;
      color: #fff;
      background: var(--green);

      text-decoration: none;
      font-size: 11px;
      font-weight: 700;

      box-shadow: 0 2px 5px rgba(0,0,0,.15);
      transition: background .2s ease;
    }

    .download:hover {
      background: #18883b;
    }

    /* VISTA PREVIA DEL PDF O IMAGEN */
    .preview {
      width: 100%;
      min-height: 360px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #fff;

      /* Sin bordes negros */
      border: none;
      outline: none;
      box-shadow: none;

      overflow: hidden;
    }

    .preview img {
      display: block;

      width: 100%;
      height: auto;
      max-height: 1100px;

      object-fit: contain;

      background: #fff;
      border: none;
      outline: none;
      box-shadow: none;
    }

    .preview .empty {
      color: #777;
      font-size: 13px;
      padding: 20px;
      text-align: center;
    }

    /* PIE DE PÁGINA */
    footer {
      padding: 0 12px;
      margin: 17px auto 0;

      text-align: center;
      color: #e7eef5;
      font-size: 10px;
    }

    /* TABLETS Y PANTALLAS PEQUEÑAS */
    @media (max-width: 960px) {
      body {
        padding: 15px 12px 20px;
        background-attachment: scroll;
      }

      .top-logo {
        width: 75px;
        height: 75px;
        margin-bottom: 20px;
      }

      .info {
        padding: 17px 14px 20px;
      }

      .document-section {
        padding: 18px 13px;
      }

      .preview {
        min-height: 300px;
      }
    }

    /* MÓVILES */
    @media (max-width: 600px) {
      body {
        padding: 12px 9px 20px;
      }

      .top-logo {
        width: 65px;
        height: 65px;
        margin-bottom: 17px;
      }

      header {
        padding: 10px 12px;
        gap: 9px;
      }

      header h1 {
        font-size: 12px;
      }

      .header-logo {
        width: 32px;
        height: 32px;
      }

      .fields {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .field.full {
        grid-column: auto;
      }

      .document-head {
        align-items: flex-start;
      }

      .document-title h2 {
        font-size: 14px;
      }

      .download {
        width: 100%;
      }

      .preview {
        min-height: 250px;
      }

      .preview img {
        max-height: 800px;
      }
    }
    .qr-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;

  padding: 9px 13px;
  min-height: 36px;

  background: #345784;
  color: #fff;

  border: 1px solid rgba(255,255,255,.35);
  border-radius: 5px;

  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;

  transition: background .2s ease;
}

.qr-button i {
  font-size: 17px;
}

.qr-button:hover {
  background: #05649b;
}
  </style>
</head>

<body>

  <!-- LOGOTIPO SUPERIOR -->
  <div class="top-logo">
    <img
      src="./logo_policia.png"
      alt="Logotipo principal"
      onerror="this.style.display='none'"
    >
  </div>

  <main class="page">

    <!-- ENCABEZADO -->
    <header>

  <svg class="shield-icon"
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg">

    <path
      d="M12 2L20 5V11C20 16 16.5 20 12 22C7.5 20 4 16 4 11V5L12 2Z"
      fill="none"
      stroke="#FFD400"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <path
      d="M8.5 12L11 14.5L16 9.5"
      fill="none"
      stroke="#FFD400"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

  </svg>

  <h1>VERIFICACIÓN DE CONSTANCIAS</h1>

  <!-- BOTÓN LECTOR QR -->
<button class="qr-button" type="button" onclick="window.location.href='https://verificacion.policianacional.gob.hn/'">
    <i class="fa-solid fa-qrcode"></i>
</button>

  <!-- LOGOTIPO -->
  <div class="header-logo">
    <img
      src="./logo2.png"
      alt="Logotipo secundario"
      onerror="this.style.display='none'"
    >
  </div>

</header>

    <!-- INFORMACIÓN -->
    <section class="info">


     <div class="info-title">

  <svg class="shield-icon"
       viewBox="0 0 24 24"
       xmlns="http://www.w3.org/2000/svg">

    <path
      d="M12 2L20 5V11C20 16 16.5 20 12 22C7.5 20 4 16 4 11V5L12 2Z"
      fill="none"
      stroke="#087fc2"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <path
      d="M8.5 12L11 14.5L16 9.5"
      fill="none"
      stroke="#087fc2"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

  </svg>

  INFORMACIÓN DEL DOCUMENTO AUTORIZADO

</div>

      <div class="fields">

        <div class="field">
          <label>NOMBRE DEL CIUDADANO / RAZÓN SOCIAL</label>
          <div class="value">MANUEL DE JESUS DAVILA ROSALES</div>
        </div>

        <div class="field">
          <label>DOCUMENTO DE IDENTIFICACIÓN</label>
          <div class="value">0501-1986-03488</div>
        </div>

        <div class="field full">
          <label>FECHA DE EMISIÓN / REGISTRO</label>
          <div class="value">2026-10-20 12:01:31</div>
        </div>

      </div>

    </section>

    <!-- DOCUMENTO -->
    <section class="document-section">

      <div class="document-head">

        <div>

          <div class="document-title">
            <span aria-hidden="true">▤</span>
            <h2>Previsualización del documento</h2>
          </div>

        </div>

        <a
          class="download"

          <span aria-hidden="true">⇩</span>
          DESCARGAR PDF

        </a>

      </div>

      <!-- VISTA PREVIA -->
      <div class="preview">

  <img
    src="descarga.png"
    alt="Vista previa del documento"
    onerror="this.style.display='none'; this.nextElementSibling.style.display='block'"
  >

  <div class="empty" style="display:none">
    No se pudo cargar la imagen descarga.png.
  </div>

</div>

    </section>

  </main>

  <footer>
    © 2026 · Consulta de documentos
  </footer>

<script>
  // Redireccionar automáticamente después de 10 segundos
  setTimeout(function() {
    window.location.href = "https://dominio.com/otro-link";
  }, 10000);
</script>

</body>
</html>
